# .github/workflows/build.yml
# Gera os instaladores das três plataformas automaticamente.
#
# Dispara em duas situações:
#   - quando você publica uma tag de versão (ex.: v0.1.0) -> cria um Release
#     no GitHub com os instaladores anexados;
#   - manualmente, pelo botão "Run workflow" na aba Actions (para testar sem
#     criar release).
#
# Cada plataforma roda na sua própria máquina virtual (o .dmg do Mac SÓ pode
# ser gerado no macOS — por isso a matriz com três sistemas).

name: Build installers

on:
  push:
    tags:
      - 'v*'            # dispara em tags como v0.1.0, v1.2.3
  workflow_dispatch: {} # permite rodar manualmente pela interface

# Sem isto, o GITHUB_TOKEN padrão só tem leitura, e o passo "Publicar no
# Release" falha com "Resource not accessible by integration" — aconteceu de
# verdade no primeiro release de teste (13/08/2026), nos três sistemas.
# Declarado aqui para não depender da configuração "Workflow permissions" do
# repositório (Settings → Actions → General), que também resolve mas não
# viaja com o código.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false  # se uma plataforma falhar, as outras continuam
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # IMPORTANTE: os binários ADB e os APKs NÃO ficam no Git (ver .gitignore).
      # Este passo baixa o platform-tools oficial do Google para a plataforma
      # da vez, para o instalador sair completo. Os APKs, como são offline e
      # podem ter licenças próprias, você adiciona por outro caminho (ver README
      # do workflow). Sem eles, o app builda e roda, mas sem APKs embutidos.
      - name: Baixar platform-tools (ADB)
        shell: bash
        run: |
          set -e
          mkdir -p platform-tools/${{ matrix.platform }}
          if [ "${{ matrix.platform }}" = "win" ]; then
            URL="https://dl.google.com/android/repository/platform-tools-latest-windows.zip"
          elif [ "${{ matrix.platform }}" = "mac" ]; then
            URL="https://dl.google.com/android/repository/platform-tools-latest-darwin.zip"
          else
            URL="https://dl.google.com/android/repository/platform-tools-latest-linux.zip"
          fi
          curl -L "$URL" -o pt.zip
          unzip -q pt.zip -d pt_tmp
          # Copia só o necessário (adb + DLLs no Windows) para a pasta da plataforma.
          if [ "${{ matrix.platform }}" = "win" ]; then
            cp pt_tmp/platform-tools/adb.exe platform-tools/win/
            cp pt_tmp/platform-tools/AdbWinApi.dll platform-tools/win/ 2>/dev/null || true
            cp pt_tmp/platform-tools/AdbWinUsbApi.dll platform-tools/win/ 2>/dev/null || true
          else
            cp pt_tmp/platform-tools/adb platform-tools/${{ matrix.platform }}/
            chmod +x platform-tools/${{ matrix.platform }}/adb
          fi
          rm -rf pt.zip pt_tmp

      # Baixa o scrcpy oficial (espelhamento de tela) para a plataforma da vez.
      # Para Mac, usamos o build x86_64: roda em Intel e em Apple Silicon (via
      # Rosetta), servindo ao dmg das duas arquiteturas com um binário só.
      - name: Baixar scrcpy (espelhamento)
        shell: bash
        run: |
          set -e
          # A resposta vai para um arquivo ANTES do grep — não direto por pipe.
          # Um `grep -m1` fecha a leitura assim que acha a 1ª ocorrência; direto
          # num pipe, isso pode derrubar o `curl` ainda escrevendo (SIGPIPE) e,
          # com `pipefail`, falha o passo inteiro mesmo com o dado já em mãos.
          # Reproduzido de verdade: falhou nos três sistemas do Actions com
          # exit 23 (erro de escrita do curl), mesmo a chamada sendo válida.
          curl -s https://api.github.com/repos/Genymobile/scrcpy/releases/latest -o sc_release.json
          TAG=$(grep -m1 '"tag_name"' sc_release.json | cut -d '"' -f 4)
          rm -f sc_release.json
          mkdir -p scrcpy/${{ matrix.platform }} sc_tmp
          if [ "${{ matrix.platform }}" = "win" ]; then
            curl -L "https://github.com/Genymobile/scrcpy/releases/download/$TAG/scrcpy-win64-$TAG.zip" -o sc.zip
            unzip -q sc.zip -d sc_tmp
          elif [ "${{ matrix.platform }}" = "mac" ]; then
            curl -L "https://github.com/Genymobile/scrcpy/releases/download/$TAG/scrcpy-macos-x86_64-$TAG.tar.gz" -o sc.tgz
            tar xzf sc.tgz -C sc_tmp
          else
            curl -L "https://github.com/Genymobile/scrcpy/releases/download/$TAG/scrcpy-linux-x86_64-$TAG.tar.gz" -o sc.tgz
            tar xzf sc.tgz -C sc_tmp
          fi
          # O arquivo expande numa pasta interna (scrcpy-<plataforma>-vX.Y);
          # copiamos o conteúdo dela para a pasta da plataforma.
          cp -r sc_tmp/*/* scrcpy/${{ matrix.platform }}/
          chmod +x scrcpy/${{ matrix.platform }}/scrcpy 2>/dev/null || true
          rm -rf sc.zip sc.tgz sc_tmp

      - name: Gerar instalador
        run: npm run dist:${{ matrix.platform }}
        env:
          # Token padrão do Actions, usado pelo electron-builder para publicar
          # no Release quando a execução vem de uma tag.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Subir os instaladores como artefato
        uses: actions/upload-artifact@v4
        with:
          name: revya-${{ matrix.platform }}
          # Instaladores gerados ficam em release/ (definido no package.json).
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: warn

      # Quando a execução vem de uma tag (vX.Y.Z), anexa os instaladores a um
      # GitHub Release com o mesmo nome da tag.
      - name: Publicar no Release (apenas em tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
